<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="Diagram of the PNT sky: GNSS in medium Earth orbit, dedicated LEO-PNT, communications constellations repurposed for PNT, and non-space cross-checks">
  <rect width="1200" height="640" fill="#050A19"/>
  <text x="60" y="64" fill="#F1F5FF" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="700">The PNT sky is getting crowded</text>
  <text x="60" y="98" fill="#9DB4D8" font-family="Inter,Arial,sans-serif" font-size="18">Four layers, each answering a different question about where you are</text>
  <g font-family="Inter,Arial,sans-serif">
    <rect x="60" y="130" width="1080" height="100" rx="14" fill="#0A1530" stroke="#818CF8" stroke-opacity=".5"/>
    <text x="90" y="170" fill="#818CF8" font-size="14" font-weight="700" letter-spacing="2">MEO ~20,000 KM</text>
    <text x="90" y="202" fill="#F1F5FF" font-size="24" font-weight="700">GNSS: GPS, Galileo, BeiDou, GLONASS, NavIC</text>
    <text x="640" y="170" fill="#9DB4D8" font-size="17">Global, free, weak signal.</text>
    <text x="640" y="196" fill="#9DB4D8" font-size="17">This month: ESA orders 4 more Galileo G2 (fleet of 16).</text>
    <text x="640" y="222" fill="#9DB4D8" font-size="17">NavIC's NVS-03 slated to launch.</text>

    <rect x="60" y="250" width="1080" height="100" rx="14" fill="#0A1530" stroke="#5CE1FF" stroke-opacity=".6"/>
    <text x="90" y="290" fill="#5CE1FF" font-size="14" font-weight="700" letter-spacing="2">LEO ~500-550 KM · BUILT FOR PNT</text>
    <text x="90" y="322" fill="#F1F5FF" font-size="24" font-weight="700">Xona Pulsar and ESA Celeste</text>
    <text x="640" y="290" fill="#9DB4D8" font-size="17">Stronger signal, fast geometry change.</text>
    <text x="640" y="316" fill="#9DB4D8" font-size="17">This month: 6 Pulsar satellites launched; Celeste's first</text>
    <text x="640" y="342" fill="#9DB4D8" font-size="17">in-orbit end-to-end results.</text>

    <rect x="60" y="370" width="1080" height="100" rx="14" fill="#0A1530" stroke="#5CE1FF" stroke-opacity=".3"/>
    <text x="90" y="410" fill="#5CE1FF" font-size="14" font-weight="700" letter-spacing="2">LEO · COMMS REPURPOSED FOR PNT</text>
    <text x="90" y="442" fill="#F1F5FF" font-size="24" font-weight="700">Iridium PNT, Starlink direct-to-cell</text>
    <text x="640" y="410" fill="#9DB4D8" font-size="17">Opportunistic signals, no new launches needed.</text>
    <text x="640" y="436" fill="#9DB4D8" font-size="17">This month: Iridium PNT ASIC in production; Starlink</text>
    <text x="640" y="462" fill="#9DB4D8" font-size="17">DTC Doppler fix at 2.7 m horizontal (one short test).</text>

    <rect x="60" y="490" width="1080" height="100" rx="14" fill="#0A1530" stroke="#9DB4D8" stroke-opacity=".4"/>
    <text x="90" y="530" fill="#9DB4D8" font-size="14" font-weight="700" letter-spacing="2">GROUND / ONBOARD · NO SATELLITES</text>
    <text x="90" y="562" fill="#F1F5FF" font-size="24" font-weight="700">Inertial, vision, AIS, map-matching</text>
    <text x="640" y="530" fill="#9DB4D8" font-size="17">The sanity check when every sky layer is jammed.</text>
    <text x="640" y="556" fill="#9DB4D8" font-size="17">This month: AIS-GNSS fusion lifts simulated jamming</text>
    <text x="640" y="582" fill="#9DB4D8" font-size="17">detection from ~75% to ~93%.</text>
  </g>
</svg>
